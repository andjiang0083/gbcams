[env:cams3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.psram = enable
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
; v0.1.0: esp32-camera 走框架自带 (framework-arduinoespressif32-libs/esp32s3 含头文件+静态库,
; mega_ccm/PY260 驱动符号已确认在档); 原 git URL 依赖在本机从未被消费,
; 且在 DNS 被拦网络下导致构建失败 — 移除。如需钉死上游 master, 恢复下行即可。
; lib_deps = https://github.com/espressif/esp32-camera.git
lib_extra_dirs = lib
