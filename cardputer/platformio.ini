; GBCAMS 接收端 — Dual-mode (ESP-NOW / AP-HTTP)
[platformio]
src_dir = src
include_dir = include

[env:m5cardputer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.psram = enable
board_build.flash_mode = dio
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_ARDUHAL_ESP_LOG=0
    -DAPP_VERSION_RAW=${sysenv.CAMERA_VERSION}
lib_deps =
    m5stack/M5Unified@^0.2.10
    m5stack/M5GFX@^0.2.15
    m5stack/M5Cardputer@^1.1.1
lib_extra_dirs = lib
